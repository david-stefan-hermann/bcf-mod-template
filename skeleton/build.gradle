plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.7'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // bcf-guide-book-lib: `./gradlew publishToMavenLocal` in ../bcf-guide-book-lib
    mavenLocal {
        content {
            includeGroup 'de.baconcakefactory'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The guide book's screen (bundled as a nested jar).
    implementation "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
    include "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
}

// `./gradlew runClient -PbookShots`: the dev client joins the world run/saves/bookshots (item stacks need a world's
// registries, the title screen has none), opens every page of the guide book, saves
// run/screenshots/book___MODID___<language>_<nr>.png and quits (see GuideBookClient in bcf-guide-book-lib). The
// language comes from run/options.txt (lang:de_de; pauseOnLostFocus:false keeps the pause menu away).
if (project.hasProperty('bookShots')) {
    loom {
        runs {
            client {
                vmArg "-Dbcf.guidebook.shots=${project.bookShots ?: '__MODID__'}"
                programArgs "--quickPlaySingleplayer", "bookshots", "--width", "1280", "--height", "720"
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

base {
    archivesName = project.archives_base_name
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// `./gradlew publishMods` uploads build/libs/<jar> to Modrinth and CurseForge. Tokens and project ids live in
// ~/.gradle/gradle.properties (__INITIALS__.modrinth.token / __INITIALS__.modrinth.projectId /
// __INITIALS__.curseforge.token / __INITIALS__.curseforge.projectId), never in the repository. A platform without a
// project id is skipped. The changelog is the top section of CHANGELOG.md.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = provider { topChangelogSection() }
    type = STABLE
    displayName = "__MOD_NAME__ ${project.version}"
    version = project.version.toString()
    modLoaders.add("fabric")

    if (project.hasProperty('__INITIALS__.modrinth.projectId')) {
        modrinth {
            accessToken = providers.gradleProperty("__INITIALS__.modrinth.token")
            projectId = providers.gradleProperty("__INITIALS__.modrinth.projectId")
            minecraftVersions.add(project.minecraft_version)
            requires("fabric-api")
        }
    }
    if (project.hasProperty('__INITIALS__.curseforge.projectId')) {
        curseforge {
            accessToken = providers.gradleProperty("__INITIALS__.curseforge.token")
            projectId = providers.gradleProperty("__INITIALS__.curseforge.projectId")
            minecraftVersions.add(project.minecraft_version)
            javaVersions.add(JavaVersion.VERSION_25)
            clientRequired = true
            serverRequired = true
            requires("fabric-api")
        }
    }
}

/** First "## " section of CHANGELOG.md, without its heading. */
String topChangelogSection() {
    def lines = file("CHANGELOG.md").readLines()
    def out = []
    boolean inSection = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (inSection) break
            inSection = true
            continue
        }
        if (inSection) out << line
    }
    return out.join("\n").trim()
}
